name: CI

on:
  push:
    branches:
      - mvp-thai-cages
  pull_request:
    branches:
      - v1-release-baseline
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ci-test-only
  VITE_FIREBASE_AUTH_DOMAIN: birdsmyboss-ci.invalid
  VITE_FIREBASE_PROJECT_ID: birdsmyboss-ci
  VITE_FIREBASE_STORAGE_BUCKET: birdsmyboss-ci.invalid
  VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  VITE_FIREBASE_APP_ID: "1:000000000000:web:ci"

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci
      - name: TypeScript
        run: npm run typecheck

  unit:
    name: Unit and component tests
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci
      - name: Unit and component tests
        run: npm test

  backend:
    name: Backend regression
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci
      - name: Backend regression
        run: npm run test:backend:all

  e2e:
    name: Playwright E2E
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Production build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix web ci
      - name: Production build
        run: npm run build
