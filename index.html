            { id: 'P-1', maleBandId: 'GCC-2022-M01', femaleBandId: 'GCC-2022-F01', cageNo: 'กรง 01', pairDate: '2024-11-01', status: 'active', notes: 'กำลังกกไข่คอกที่ 2' },

        const INITIAL_CLUTCHES = [
            { id: 'C-1', pairId: 'P-1', clutchNo: '1', startDate: '2024-12-01', totalEggs: 5, fertileEggs: 4, hatched: 4, fledged: 4, notes: 'ลูกนกแข็งแรงดี รอดครบ' }
        ];

        const INITIAL_SALES = [];
        const INITIAL_EXPENSES = [
            { id: 'E-1', date: '2025-02-01', category: 'อาหาร/ธัญพืช', amount: 1800, note: 'อาหารผสม + ผลไม้อบแห้ง 10 กก.' }
        ];

        // Normalizer function for imported JSON bird objects
        function normalizeBirdData(b) {
            let gender = b.gender;
            if (gender === 'ผู้') gender = 'M';
            else if (gender === 'เมีย') gender = 'F';
            else if (gender !== 'M' && gender !== 'F') gender = 'U';

            let status = b.status;
            if (status === 'จับคู่แล้ว') status = 'paired';
            else if (status === 'โสด' || status === 'พร้อมผสม') status = 'available';
            else if (status === 'ขายแล้ว') status = 'sold';
            else if (!status) status = 'available';

            return {
                id: b.id || `b_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
                bandId: b.ring || b.bandId || b.id || `GCC-${new Date().getFullYear()}-000`,
                name: b.name || '',
                color: b.color || 'Green Cheek',
                gender: gender,
                status: status,
                pedigree: b.bloodline || b.pedigree || '',
                hatchDate: b.dob || b.hatchDate || '',
                acquireDate: b.acquireDate || b.dob || new Date().toISOString().split('T')[0],
                price: Number(b.price || 0),
                notes: b.notes || ''
            };
        }

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Online Sync & Auth states
            const [user, setUser] = useState(null);
            const [isOnline, setIsOnline] = useState(false);
            const [syncStatus, setSyncStatus] = useState('initializing'); // 'initializing', 'synced', 'saving', 'error'
            
            // Core App States
            const [birds, setBirds] = useState(() => {
                const saved = localStorage.getItem('gcc_birds');
                return saved ? JSON.parse(saved) : USER_PROVIDED_BIRDS;
            });
            const [pairs, setPairs] = useState(() => {
                const saved = localStorage.getItem('gcc_pairs');
                return saved ? JSON.parse(saved) : INITIAL_PAIRS;
            });
            const [clutches, setClutches] = useState(() => {
                const saved = localStorage.getItem('gcc_clutches');
                return saved ? JSON.parse(saved) : INITIAL_CLUTCHES;
            });
            const [sales, setSales] = useState(() => {
                const saved = localStorage.getItem('gcc_sales');
                return saved ? JSON.parse(saved) : INITIAL_SALES;
            });
            const [expenses, setExpenses] = useState(() => {
                const saved = localStorage.getItem('gcc_expenses');
                return saved ? JSON.parse(saved) : INITIAL_EXPENSES;
            });

            // Modals & Toasts
            const [toastMessage, setToastMessage] = useState(null);
            const [showJsonModal, setShowJsonModal] = useState(false);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const appId = typeof __app_id !== 'undefined' ? __app_id : 'birdsmyboss';

            // Firebase Authentication Initialization
            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FB) return;
                    const { auth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = window.FB;

                    try {
                        let authUser = null;
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            const res = await signInWithCustomToken(auth, __initial_auth_token);
                            authUser = res.user;
                        } else {
                            const res = await signInAnonymously(auth);
                            authUser = res.user;
                        }

                        onAuthStateChanged(auth, (u) => {
                            if (u) {
                                setUser(u);
                                setIsOnline(true);
                                setSyncStatus('synced');
                            }
                        });
                    } catch (err) {
                        console.error('Firebase Auth Error:', err);
                        setSyncStatus('error');
                    }
                };

                initFirebase();
            }, []);

            // Firebase Firestore Subscriptions (Realtime Listener)
            useEffect(() => {
                if (!user || !window.FB) return;
                const { db, collection, onSnapshot } = window.FB;

                // Rule 1 Strict Path: /artifacts/{appId}/public/data/{collectionName}
                const setupListener = (colName, setter, defaultData) => {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', colName);
                    return onSnapshot(colRef, (snapshot) => {
                        const items = [];
                        snapshot.forEach((doc) => {
                            items.push({ ...doc.data(), id: doc.id });
                        });
                        if (items.length > 0) {
                            setter(items);
                        } else if (defaultData && defaultData.length > 0) {
                            // Seed initial Firestore data if collection is completely empty
                            items.push(...defaultData);
                            defaultData.forEach(async (item) => {
                                const docRef = window.FB.doc(db, 'artifacts', appId, 'public', 'data', colName, item.id);
                                await window.FB.setDoc(docRef, item);
                            });
                            setter(defaultData);
                        }
                        setSyncStatus('synced');
                    }, (error) => {
                        console.error(`Firestore Snapshot Error (${colName}):`, error);
                        setSyncStatus('error');
                    });
                };

                const unsubBirds = setupListener('birds', setBirds, USER_PROVIDED_BIRDS);
                const unsubPairs = setupListener('pairs', setPairs, INITIAL_PAIRS);
                const unsubClutches = setupListener('clutches', setClutches, INITIAL_CLUTCHES);
                const unsubSales = setupListener('sales', setSales, INITIAL_SALES);
                const unsubExpenses = setupListener('expenses', setExpenses, INITIAL_EXPENSES);

                return () => {
                    unsubBirds();
                    unsubPairs();
                    unsubClutches();
                    unsubSales();
                    unsubExpenses();
                };
            }, [user, appId]);

            // Save handlers with Firebase + LocalStorage fallback
            const saveData = async (colName, dataList) => {
                // Always sync to LocalStorage
                localStorage.setItem(`gcc_${colName}`, JSON.stringify(dataList));

                // If online, save to Firestore
                if (user && window.FB) {
                    try {
                        setSyncStatus('saving');
                        const { db, doc, setDoc } = window.FB;
                        for (const item of dataList) {
                            const itemDoc = doc(db, 'artifacts', appId, 'public', 'data', colName, item.id);
                            await setDoc(itemDoc, item, { merge: true });
                        }
                        setSyncStatus('synced');
                    } catch (err) {
                        console.error(`Firestore Save Error (${colName}):`, err);
                        setSyncStatus('error');
                    }
                }
            };

            const deleteDocOnline = async (colName, itemId) => {
                if (user && window.FB) {
                    try {
                        setSyncStatus('saving');
                        const { db, doc, deleteDoc } = window.FB;
                        const itemDoc = doc(db, 'artifacts', appId, 'public', 'data', colName, itemId);
                        await deleteDoc(itemDoc);
                        setSyncStatus('synced');
                    } catch (err) {
                        console.error(`Firestore Delete Error:`, err);
                        setSyncStatus('error');
                    }
                }
            };

            // Wrap state setters with auto-save
            const updateBirds = (newBirds) => { setBirds(newBirds); saveData('birds', newBirds); };
            const updatePairs = (newPairs) => { setPairs(newPairs); saveData('pairs', newPairs); };
            const updateClutches = (newClutches) => { setClutches(newClutches); saveData('clutches', newClutches); };
            const updateSales = (newSales) => { setSales(newSales); saveData('sales', newSales); };
            const updateExpenses = (newExpenses) => { setExpenses(newExpenses); saveData('expenses', newExpenses); };

                                    </div>

                                    </div>
                                </div>
                            </div>

                            {/* Online Sync Indicator */}
                            <div className="mx-4 mt-4 p-3 bg-emerald-950/60 rounded-xl border border-emerald-800/80 text-xs flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <span className={`w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                    <span className="font-medium text-emerald-100">
                                        {isOnline ? 'เชื่อมต่อออนไลน์แล้ว' : 'โหมดออฟไลน์ (Local)'}
                                    </span>
                                </div>
                                <span className="text-[10px] bg-emerald-800/60 text-emerald-200 px-2 py-0.5 rounded">
                                    {syncStatus === 'saving' ? 'บันทึก...' : syncStatus === 'synced' ? 'Sync OK' : 'Ready'}
                                </span>
                            </div>

                            {/* Navigation Tabs */}
                            <nav className="p-4 space-y-1">
                                <button
                                    onClick={() => setActiveTab('dashboard')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${activeTab === 'dashboard' ? 'bg-emerald-600 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}
                                >
                                    <i className="fa-solid fa-chart-pie w-5"></i> ภาพรวมฟาร์ม
                                </button>
                                <button
                                    onClick={() => setActiveTab('birds')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${activeTab === 'birds' ? 'bg-emerald-600 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}
                                >
                                    <i className="fa-solid fa-feather w-5"></i> ข้อมูลนกทั้งหมด ({birds.length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('pairs')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${activeTab === 'pairs' ? 'bg-emerald-600 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}
                                >
                                    <i className="fa-solid fa-heart w-5"></i> บันทึกการจับคู่ ({pairs.length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('eggs')}

                                >
                                    <i className="fa-solid fa-egg w-5"></i> ประวัติไข่ & ลูกนก
                                </button>
                                <button
                                    onClick={() => setActiveTab('sales')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${activeTab === 'sales' ? 'bg-emerald-600 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}
                                >
                                    <i className="fa-solid fa-hand-holding-dollar w-5"></i> บันทึกการขาย ({sales.length})
                                </button>
                                <button
                                    onClick={() => setActiveTab('expenses')}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition font-medium text-sm ${activeTab === 'expenses' ? 'bg-emerald-600 text-white shadow-md' : 'text-emerald-100 hover:bg-emerald-800'}`}
                                >
                                    <i className="fa-solid fa-file-invoice-dollar w-5"></i> ค่าใช้จ่าย & กราฟ
                                </button>
                            </nav>
                        </div>

                        {/* Import / Export Data Tools */}
                        <div className="p-4 border-t border-emerald-800 space-y-2">
                            <button
                                onClick={() => setShowJsonModal(true)}
                                className="w-full py-2.5 px-3 bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 text-xs rounded-xl font-medium flex items-center justify-center gap-2 transition"
                            >
                                <i className="fa-solid fa-file-import text-amber-400"></i>
                                <span>นำเข้า / ส่งออกข้อมูล JSON</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                        {/* Toast Notification */}
                        {toastMessage && (
                            <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-bounce">
                                <i className="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
                                <span>{toastMessage}</span>
                            </div>
                        )}

                        {activeTab === 'dashboard' && <DashboardView birds={birds} pairs={pairs} clutches={clutches} sales={sales} expenses={expenses} setActiveTab={setActiveTab} setShowJsonModal={setShowJsonModal} />}
                        {activeTab === 'birds' && <BirdsView birds={birds} setBirds={updateBirds} deleteDocOnline={deleteDocOnline} showToast={showToast} setShowJsonModal={setShowJsonModal} />}
                        {activeTab === 'pairs' && <PairsView birds={birds} setBirds={updateBirds} pairs={pairs} setPairs={updatePairs} clutches={clutches} deleteDocOnline={deleteDocOnline} showToast={showToast} />}
                        {activeTab === 'eggs' && <EggsView pairs={pairs} birds={birds} clutches={clutches} setClutches={updateClutches} deleteDocOnline={deleteDocOnline} showToast={showToast} />}
                        {activeTab === 'sales' && <SalesView birds={birds} sales={sales} setSales={updateSales} deleteDocOnline={deleteDocOnline} showToast={showToast} />}
                        {activeTab === 'expenses' && <ExpensesView expenses={expenses} setExpenses={updateExpenses} deleteDocOnline={deleteDocOnline} showToast={showToast} />}
                    </main>

                    {/* JSON Import/Export Modal */}
                    {showJsonModal && (
                        <JsonDataModal
                            birds={birds}
                            setBirds={updateBirds}
                            pairs={pairs}
                            clutches={clutches}
                            sales={sales}
                            expenses={expenses}
                            setShowJsonModal={setShowJsonModal}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }

        function DashboardView({ birds, pairs, clutches, sales, expenses, setActiveTab, setShowJsonModal }) {
            const totalBirds = birds.length;
            const pairedCount = birds.filter(b => b.status === 'paired' || b.status === 'จับคู่แล้ว').length;

            const totalHatched = clutches.reduce((acc, c) => acc + Number(c.hatched || 0), 0);

            const totalIncome = sales.reduce((acc, s) => acc + Number(s.price || 0), 0);
            const totalExpenses = expenses.reduce((acc, e) => acc + Number(e.amount || 0), 0);

                        </div>
                        <button
                            onClick={() => setShowJsonModal(true)}
                            className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-sm transition"
                        >
                            <i className="fa-solid fa-file-code"></i> จัดการไฟล์ข้อมูล JSON

                    </div>

                    {/* Stat Cards */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-slate-400 text-xs font-medium">นกทั้งหมดในฟาร์ม</p>
                                <p className="text-3xl font-bold text-slate-800 mt-1">{totalBirds} <span className="text-sm font-normal text-slate-500">ตัว</span></p>
                                <p className="text-xs text-emerald-600 mt-1 font-medium">พร้อมผสม {availableCount} ตัว</p>
                            </div>
                            <div className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-kiwi-bird"></i>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">

                                <p className="text-xs text-slate-500 mt-1">นกจับคู่แล้ว {pairedCount} ตัว</p>

                            <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-heart"></i>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">

                                <p className="text-slate-400 text-xs font-medium">ไข่รวม / ฟักเป็นตัวแล้ว</p>
                                <p className="text-3xl font-bold text-amber-600 mt-1">{totalEggs} / {totalHatched}</p>
                                <p className="text-xs text-amber-700 mt-1 font-medium">อัตราฟักสำเร็จ {totalEggs ? Math.round((totalHatched/totalEggs)*100) : 0}%</p>
                            </div>
                            <div className="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-egg"></i>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                            <div>
                                <p className="text-slate-400 text-xs font-medium">ยอดขาย / ค่าใช้จ่าย</p>
                                <p className="text-xl font-bold text-emerald-600 mt-1">฿{totalIncome.toLocaleString()}</p>
                                <p className="text-xs text-rose-500 mt-1 font-medium">รายจ่าย ฿{totalExpenses.toLocaleString()}</p>
                            </div>
                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl">
                                <i className="fa-solid fa-wallet"></i>
                            </div>
                        </div>
                    </div>

                    {/* Quick Shortcuts */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                        <h3 className="font-bold text-slate-800 text-base">เมนูดำเนินการด่วน</h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <button onClick={() => setActiveTab('birds')} className="p-4 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 transition text-left space-y-2 group">

                                <p className="font-semibold text-sm text-slate-700">เพิ่มนกใหม่เข้าฟาร์ม</p>
                            </button>
                            <button onClick={() => setActiveTab('pairs')} className="p-4 rounded-xl border border-slate-200 hover:border-rose-500 hover:bg-rose-50 transition text-left space-y-2 group">
                                <i className="fa-solid fa-user-plus text-rose-500 text-lg group-hover:scale-110 transition-transform"></i>
                                <p className="font-semibold text-sm text-slate-700">จับคู่นกตัวผู้-เมีย</p>
                            </button>

                                <i className="fa-solid fa-square-plus text-amber-500 text-lg group-hover:scale-110 transition-transform"></i>
                                <p className="font-semibold text-sm text-slate-700">บันทึกคอกไข่ใหม่</p>
                            </button>

        function BirdsView({ birds, setBirds, deleteDocOnline, showToast, setShowJsonModal }) {

            const [filterGender, setFilterGender] = useState('ALL');
            const [filterStatus, setFilterStatus] = useState('ALL');

            const [showModal, setShowModal] = useState(false);

            const [formData, setFormData] = useState({
                bandId: '', name: '', color: 'Pineapple', gender: 'M', pedigree: '', hatchDate: '', acquireDate: '', status: 'available', price: 0, notes: ''

                setEditingBird(null);
                setFormData({
                    bandId: `GCC-${new Date().getFullYear()}-M0${Math.floor(1 + Math.random() * 9)}`,
                    name: '',
                    color: 'พายแอปเปิ้ล',
                    gender: 'M',
                    pedigree: '',
                    hatchDate: new Date().toISOString().split('T')[0],
                    acquireDate: new Date().toISOString().split('T')[0],
                    status: 'available',
                    price: 2500,
                    notes: ''
                });
                setShowModal(true);
            };

            const openEditModal = (bird) => {
                setEditingBird(bird);
                setFormData({
                    ...bird,
                    bandId: bird.bandId || bird.ring || '',
                    pedigree: bird.pedigree || bird.bloodline || '',
                    hatchDate: bird.hatchDate || bird.dob || ''

                setShowModal(true);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.bandId.trim()) return;

                if (editingBird) {
                    setBirds(birds.map(b => b.id === editingBird.id ? { ...formData } : b));
                    showToast('อัปเดตข้อมูลนกเรียบร้อย');
                } else {
                    const newBird = { ...formData, id: `b_${Date.now()}` };
                    setBirds([...birds, newBird]);
                    showToast('บันทึกข้อมูลนกใหม่เรียบร้อย');
                }
                setShowModal(false);
            };

            const handleDelete = (id) => {
                if (window.confirm('คุณต้องการลบข้อมูลนกตัวนี้หรือไม่?')) {
                    setBirds(birds.filter(b => b.id !== id));
                    deleteDocOnline('birds', id);
                    showToast('ลบข้อมูลนกเรียบร้อย');
                }
            };

            const filteredBirds = birds.filter(b => {
                const bandStr = (b.bandId || b.ring || '').toLowerCase();
                const nameStr = (b.name || '').toLowerCase();
                const colorStr = (b.color || '').toLowerCase();

                const matchSearch = bandStr.includes(searchTerm.toLowerCase()) ||
                                    nameStr.includes(searchTerm.toLowerCase()) ||
                                    colorStr.includes(searchTerm.toLowerCase());
                
                const isMale = b.gender === 'M' || b.gender === 'ผู้';
                const isFemale = b.gender === 'F' || b.gender === 'เมีย';
                const matchGender = filterGender === 'ALL' || 
                                   (filterGender === 'M' && isMale) || 
                                   (filterGender === 'F' && isFemale);

                const isPaired = b.status === 'paired' || b.status === 'จับคู่แล้ว';
                const isAvailable = b.status === 'available' || b.status === 'โสด' || b.status === 'พร้อมผสม';
                const isSold = b.status === 'sold' || b.status === 'ขายแล้ว';

                const matchStatus = filterStatus === 'ALL' ||
                                   (filterStatus === 'available' && isAvailable) ||
                                   (filterStatus === 'paired' && isPaired) ||
                                   (filterStatus === 'sold' && isSold);

                return matchSearch && matchGender && matchStatus;
            });

                        </div>
                        <div className="flex gap-2">

                                onClick={() => setShowJsonModal(true)}
                                className="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2.5 rounded-xl font-medium text-xs flex items-center gap-1.5 shadow-sm transition"

                                <i className="fa-solid fa-file-import"></i> นำเข้า JSON
                            </button>
                            <button
                                onClick={openAddModal}
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium text-sm flex items-center gap-2 shadow-sm transition"
                            >
                                <i className="fa-solid fa-plus"></i> เพิ่มนกใหม่
                            </button>
                        </div>
                    </div>

                    {/* Filters & Search */}

                            <input
                                type="text"
                                placeholder="ค้นหารหัสห่วงขา, ชื่อ, สี..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                className="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500"
                            />
                        </div>
                        <select
                            value={filterGender}
                            onChange={e => setFilterGender(e.target.value)}
                            className="px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500 bg-white"
                        >
                            <option value="ALL">เพศทั้งหมด</option>
                            <option value="M">ตัวผู้ (Male)</option>
                            <option value="F">ตัวเมีย (Female)</option>
                        </select>
                        <select
                            value={filterStatus}
                            onChange={e => setFilterStatus(e.target.value)}
                            className="px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-emerald-500 bg-white"
                        >
                            <option value="ALL">สถานะทั้งหมด</option>
                            <option value="available">พร้อมผสม / โสด</option>
                            <option value="paired">จับคู่แล้ว</option>
                            <option value="sold">ขายแล้ว</option>
                        </select>
                    </div>

                    {/* Bird Table */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-100">
                                        <th className="p-4">รหัสห่วงขา / ชื่อ</th>
                                        <th className="p-4">สี / Mutation</th>
                                        <th className="p-4">เพศ</th>
                                        <th className="p-4">สายเลือด / พ่อแม่</th>
                                        <th className="p-4">วันเกิด / ราคา</th>
                                        <th className="p-4">สถานะ</th>
                                        <th className="p-4 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-sm">
                                    {filteredBirds.length === 0 ? (
                                        <tr>
                                            <td colSpan="7" className="p-8 text-center text-slate-400">ไม่พบข้อมูลนกตามเงื่อนไขที่ค้นหา</td>
                                        </tr>
                                    ) : (
                                        filteredBirds.map(bird => {
                                            const isMale = bird.gender === 'M' || bird.gender === 'ผู้';
                                            const isFemale = bird.gender === 'F' || bird.gender === 'เมีย';
                                            const isPaired = bird.status === 'paired' || bird.status === 'จับคู่แล้ว';
                                            const isSold = bird.status === 'sold' || bird.status === 'ขายแล้ว';

                                            return (
                                                <tr key={bird.id} className="hover:bg-slate-50 transition">
                                                    <td className="p-4 font-medium text-slate-800">
                                                        <div className="font-bold text-emerald-700">{bird.bandId || bird.ring}</div>
                                                        <div className="text-xs text-slate-500">{bird.name || '-'}</div>
                                                    </td>
                                                    <td className="p-4 font-medium text-slate-700">{bird.color}</td>
                                                    <td className="p-4">
                                                        {isMale && <span className="inline-flex items-center gap-1 bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full text-xs font-semibold"><i className="fa-solid fa-mars"></i> ผู้</span>}
                                                        {isFemale && <span className="inline-flex items-center gap-1 bg-pink-50 text-pink-600 px-2.5 py-1 rounded-full text-xs font-semibold"><i className="fa-solid fa-venus"></i> เมีย</span>}
                                                        {!isMale && !isFemale && <span className="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full text-xs">ไม่ระบุ</span>}
                                                    </td>
                                                    <td className="p-4 text-xs text-slate-600 max-w-[180px] truncate">{bird.pedigree || bird.bloodline || '-'}</td>
                                                    <td className="p-4 text-xs text-slate-500">
                                                        <div>เกิด: {bird.hatchDate || bird.dob || '-'}</div>
                                                        {bird.price > 0 && <div className="text-emerald-600 font-bold mt-0.5">฿{Number(bird.price).toLocaleString()}</div>}
                                                    </td>
                                                    <td className="p-4">
                                                        {isPaired ? (
                                                            <span className="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-full font-medium">จับคู่แล้ว</span>
                                                        ) : isSold ? (

                                                            <span className="bg-emerald-100 text-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium">พร้อมผสม/โสด</span>

                                                            <button onClick={() => openEditModal(bird)} className="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 hover:bg-amber-100 flex items-center justify-center transition">

                                                                <i className="fa-solid fa-trash text-xs"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>

                                </tbody>
                            </table>

                    {/* Add/Edit Bird Modal */}

                                                type="text"
                                                required
                                                value={formData.bandId}
                                                onChange={e => setFormData({ ...formData, bandId: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"

                                            <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อนก</label>

                                                onChange={e => setFormData({ ...formData, name: e.target.value })}

                                            <input
                                                type="text"
                                                placeholder="เช่น พายแอปเปิ้ล, ซันชีค"
                                                value={formData.color}
                                                onChange={e => setFormData({ ...formData, color: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">เพศ</label>
                                            <select
                                                value={formData.gender}
                                                onChange={e => setFormData({ ...formData, gender: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 bg-white"
                                            >
                                                <option value="M">ตัวผู้ (Male)</option>
                                                <option value="F">ตัวเมีย (Female)</option>
                                                <option value="U">ไม่ระบุเพศ</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">สายเลือด / ประวัติพ่อแม่</label>
                                            <input
                                                type="text"
                                                placeholder="เช่น P, Y/B/D"
                                                value={formData.pedigree}
                                                onChange={e => setFormData({ ...formData, pedigree: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">ราคานก (บาท)</label>
                                            <input
                                                type="number"
                                                value={formData.price}
                                                onChange={e => setFormData({ ...formData, price: Number(e.target.value) })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">วันเกิด</label>
                                            <input
                                                type="date"
                                                value={formData.hatchDate}
                                                onChange={e => setFormData({ ...formData, hatchDate: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">สถานะนก</label>
                                            <select
                                                value={formData.status}
                                                onChange={e => setFormData({ ...formData, status: e.target.value })}
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 bg-white"
                                            >
                                                <option value="available">พร้อมผสม / โสด</option>
                                                <option value="paired">จับคู่แล้ว</option>
                                                <option value="sold">ขายแล้ว</option>

                e.preventDefault();
                if (!formData.maleBandId || !formData.femaleBandId) {
                    alert('กรุณาเลือกทั้งนกตัวผู้และนกตัวเมีย');
                    return;

                if (formData.maleBandId === formData.femaleBandId) {
                    alert('ไม่สามารถเลือกนกตัวเดียวกันจับคู่กันได้');
                    return;
                }

                const newPair = {
                    id: `P-${Date.now()}`,
                    ...formData,
                    status: 'active'
                };

                setPairs([...pairs, newPair]);

                // Auto update status of paired birds to 'paired'
                setBirds(birds.map(b => {
                    const bId = b.bandId || b.ring;
                    if (bId === formData.maleBandId || bId === formData.femaleBandId) {
                        return { ...b, status: 'paired' };

                        if (bId === pair.maleBandId || bId === pair.femaleBandId) {
                            return { ...b, status: 'available' };

                    return;

                const activePairId = selectedPairId || pairs[0]?.id;

                setFormData({
                    pairId: activePairId,
                    clutchNo: String(existingClutches.length + 1),
                    startDate: new Date().toISOString().split('T')[0],
                    totalEggs: 5,
                    fertileEggs: 4,
                    hatched: 3,
                    fledged: 3,

                                            value={formData.amount}
                                            onChange={e => setFormData({ ...formData, amount: Number(e.target.value) })}
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500 font-bold"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-1">รายละเอียด / หมายเหตุ</label>
                                        <textarea
                                            rows="2"
                                            placeholder="รายละเอียดค่าใช้จ่าย..."
                                            value={formData.note}
                                            onChange={e => setFormData({ ...formData, note: e.target.value })}
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-emerald-500"
                                        ></textarea>
                                    </div>

                                    <div className="flex gap-3 pt-3 border-t border-slate-100">
                                        <button
                                            type="button"
                                            onClick={() => setShowModal(false)}
                                            className="flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 shadow-md transition"
                                        >
                                            บันทึก
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function JsonDataModal({ birds, setBirds, pairs, clutches, sales, expenses, setShowJsonModal, showToast }) {
            const [jsonInput, setJsonInput] = useState('');
            const [importMode, setImportMode] = useState('birds'); // 'birds' or 'full'

            // Pre-load user provided birds JSON format into textarea for easy view
            useEffect(() => {
                setJsonInput(JSON.stringify({ birds: USER_PROVIDED_BIRDS }, null, 2));
            }, []);

            // Quick load preset provided by user
            const handleLoadUserPreset = () => {
                const normalizedPreset = USER_PROVIDED_BIRDS.map(normalizeBirdData);
                setBirds(normalizedPreset);
                showToast(`นำเข้าข้อมูลนกจำนวน ${normalizedPreset.length} ตัวสำเร็จ!`);
                setShowJsonModal(false);
            };

            // Parse and import user pasted JSON
            const handleImportPastedJson = () => {
                try {
                    const parsed = JSON.parse(jsonInput);
                    let rawBirds = [];

                    if (Array.isArray(parsed)) {
                        rawBirds = parsed;
                    } else if (parsed && Array.isArray(parsed.birds)) {
                        rawBirds = parsed.birds;
                    } else if (parsed && typeof parsed === 'object') {
                        // Single bird object
                        rawBirds = [parsed];
                    }

                    if (rawBirds.length === 0) {
                        alert('ไม่พบข้อมูลนกใน JSON ที่ระบุ กรุณาตรวจสอบฟอร์แมตอีกครั้ง');
                        return;
                    }

                    const normalizedBirds = rawBirds.map(normalizeBirdData);

                    // Combine or Replace existing birds
                    if (window.confirm(`พบข้อมูลนก ${normalizedBirds.length} ตัว ต้องการแทนที่ข้อมูลเดิมทั้งหมดใช่หรือไม่? (กด Cancel เพื่อต่อท้ายข้อมูลเดิม)`)) {
                        setBirds(normalizedBirds);
                    } else {
                        // Merge without duplicate IDs
                        const existingIds = new Set(birds.map(b => b.id));
                        const newBirds = [...birds];
                        normalizedBirds.forEach(nb => {
                            if (!existingIds.has(nb.id)) {
                                newBirds.push(nb);
                            }
                        });
                        setBirds(newBirds);
                    }

                    showToast(`นำเข้าข้อมูลเรียบร้อยแล้ว (${normalizedBirds.length} รายการ)`);
                    setShowJsonModal(false);
                } catch (err) {
                    alert('เกิดข้อผิดพลาดในการอ่านไฟล์ JSON: ' + err.message);
                }
            };

            // Export full farm backup
            const handleExportJson = () => {
                const fullBackup = {
                    birds,
                    pairs,
                    clutches,
                    sales,
                    expenses,
                    exportedAt: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gcc_farm_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('ส่งออกไฟล์สำรองข้อมูล JSON เรียบร้อยแล้ว');
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    setJsonInput(event.target.result);
                };
                reader.readAsText(file);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 flex items-center gap-2">
                                    <i className="fa-solid fa-file-code text-amber-500"></i> นำเข้า / ส่งออกข้อมูล JSON
                                </h3>
                                <p className="text-xs text-slate-500">รองรับการนำเข้าประวัตินก (ละมุด, กล้วยหวาน, อัญชัน ฯลฯ) และไฟล์ Backup ฟาร์ม</p>
                            </div>
                            <button onClick={() => setShowJsonModal(false)} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>

                        {/* Preset Quick Import Box */}
                        <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <p className="font-bold text-amber-900 text-sm">ชุดข้อมูลนกเริ่มต้น (8 ตัวที่ระบุในคำขอ)</p>
                                <p className="text-xs text-amber-700">รวม ละมุด, กล้วยหวาน, อัญชัน, เมล่อน, มะพร้าว, ส้มโอ, น้อยหน่า, เลม่อน</p>
                            </div>
                            <button
                                onClick={handleLoadUserPreset}
                                className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap shadow transition"
                            >
                                <i className="fa-solid fa-download mr-1"></i> โหลดชุดข้อมูล 8 ตัวนี้
                            </button>
                        </div>

                        {/* Textarea or Upload file */}
                        <div className="space-y-2">
                            <div className="flex justify-between items-center">
                                <label className="block text-xs font-semibold text-slate-700">วางข้อความ JSON หรือเลือกไฟล์ JSON</label>
                                <label className="cursor-pointer text-xs text-emerald-600 hover:underline font-semibold flex items-center gap-1">
                                    <i className="fa-solid fa-upload"></i> อัปโหลดไฟล์ .json
                                    <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                                </label>
                            </div>
                            <textarea
                                rows="8"
                                value={jsonInput}
                                onChange={e => setJsonInput(e.target.value)}
                                placeholder='{ "birds": [ { "name": "ละมุด", "ring": "GCC-2022-M01", ... } ] }'
                                className="w-full p-3 font-mono text-xs bg-slate-900 text-emerald-400 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500"
                            ></textarea>
                        </div>

                        {/* Action Buttons */}
                        <div className="flex flex-wrap gap-3 pt-3 border-t border-slate-100">
                            <button
                                type="button"
                                onClick={handleExportJson}
                                className="py-2.5 px-4 rounded-xl border border-slate-300 text-slate-700 text-xs font-semibold hover:bg-slate-50 transition flex items-center gap-2"
                            >
                                <i className="fa-solid fa-file-export text-blue-500"></i> สำรองข้อมูลทั้งหมด (Export Backup)
                            </button>
                            <div className="flex-1 flex justify-end gap-2">
                                <button
                                    type="button"
                                    onClick={() => setShowJsonModal(false)}
                                    className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-medium hover:bg-slate-50 transition"
                                >
                                    ปิด
                                </button>
                                <button
                                    type="button"
                                    onClick={handleImportPastedJson}
                                    className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700 shadow-md transition flex items-center gap-2"
                                >
                                    <i className="fa-solid fa-check"></i> นำเข้าข้อมูล JSON นี้
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
