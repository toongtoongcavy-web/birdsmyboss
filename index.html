<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {getFirestore,collection,doc,getDocs,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBohCYrkHMOpF3YuOk3TAt8IeMYVL-ahzw",authDomain:"birdsmyboss.firebaseapp.com",databaseURL:"https://birdsmyboss-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"birdsmyboss",storageBucket:"birdsmyboss.firebasestorage.app",messagingSenderId:"626059198758",appId:"1:626059198758:web:81dc5eb114cf964ec501e7",measurementId:"G-CZ3C54MSL8"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ROOT="artifacts/birdsmyboss-app/public/data";
const C={birds:"birds",pairs:"pairs",cycles:"breedingCycles",eggs:"eggs",chicks:"chicks",weights:"weights",sales:"sales",income:"income",expenses:"expenses"};let state={};for(const k of Object.keys(C))state[k]=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const money=n=>"฿"+Number(n||0).toLocaleString("th-TH");const coll=k=>collection(db,ROOT,C[k]);
async function load(k){try{const s=await getDocs(coll(k));state[k]=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.error(k,e)}}async function loadAll(){await Promise.all(Object.keys(C).map(load));render()}
function birdName(id){const b=state.birds.find(x=>x.id===id);return b?`${b.ring||b.code||b.id} — ${b.name||""}`:id||"-"}function age(d){if(!d)return "-";const x=new Date(d),n=new Date();let y=n.getFullYear()-x.getFullYear();if(n.getMonth()<x.getMonth()||(n.getMonth()===x.getMonth()&&n.getDate()<x.getDate()))y--;return y<1?`${Math.max(0,Math.floor((n-x)/86400000))} วัน`:y+" ปี"}
function setTab(t){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));document.getElementById(t).classList.remove("hidden");document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));document.getElementById("pageTitle").textContent={dashboard:"Dashboard",birds:"ทะเบียนนก",pairs:"คู่พ่อแม่พันธุ์",cycles:"รอบเพาะพันธุ์",eggs:"ไข่",chicks:"ลูกนก",finance:"การเงิน"}[t];render()}document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
// ===== Birds My Boss: Date Format =====
// Firebase storage: YYYY-MM-DD. User interface: DD/MM/YYYY.
function pad2(n){return String(n).padStart(2,"0")}
function toDDMMYYYY(v){
  if(!v) return "";
  const x=String(v);
  let m=x.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return `${m[3]}/${m[2]}/${m[1]}`;
  m=x.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${pad2(m[1])}/${pad2(m[2])}/${m[3]}`;
  return x;
}
function toISODate(v){
  if(!v) return "";
  const x=String(v).trim();
  let m=x.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  return x;
}
function todayDDMMYYYY(){
  const d=new Date();
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}
function dateField(id,label,value=""){
  return `<div><label>${label}</label><input id="${id}" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" value="${esc(toDDMMYYYY(value))}" maxlength="10" oninput="this.value=this.value.replace(/[^0-9\\/]/g,'').slice(0,10)"><div class="text-xs text-slate-400 mt-1">รูปแบบ: DD/MM/YYYY</div></div>`;
}

window.toggleNav=()=>document.getElementById("nav").classList.toggle("hidden");
function stat(t,v,i){return `<div class="card p-4"><div class="text-2xl">${i}</div><div class="text-xs text-slate-500 mt-2">${t}</div><div class="text-2xl font-extrabold mt-1">${v}</div></div>`}
function render(){renderDashboard();renderBirds();renderPairs();renderCycles();renderEggs();renderChicks();renderFinance()}
function renderDashboard(){const salesTotal=state.sales.reduce((a,x)=>a+Number(x.amount||0),0),inc=state.income.reduce((a,x)=>a+Number(x.amount||0),0)+salesTotal,exp=state.expenses.reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById("dashboard").innerHTML=`<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${stat("นกทั้งหมด",state.birds.length+" ตัว","🐦")}${stat("คู่พ่อแม่พันธุ์",state.pairs.length+" คู่","❤️")}${stat("ไข่",state.eggs.length+" ใบ","🥚")}${stat("ลูกนก",state.chicks.length+" ตัว","🐣")}</div><div class="card p-4 mb-5"><div class="text-sm text-slate-500">💵 ยอดขายนก</div><div class="text-2xl font-extrabold mt-1">${money(salesTotal)}</div><div class="text-xs text-slate-500 mt-1">${state.sales.length} รายการ</div></div><div class="grid lg:grid-cols-3 gap-4"><div class="card p-5 lg:col-span-2"><h3 class="font-extrabold mb-4">💰 การเงินรวม</h3><div class="grid grid-cols-3 gap-3">${stat("รายรับ",money(inc),"⬆️")}${stat("รายจ่าย",money(exp),"⬇️")}${stat("คงเหลือ",money(inc-exp),"📈")}</div></div><div class="card p-5"><h3 class="font-extrabold mb-3">⚡ ทางลัด</h3><div class="grid gap-2"><button class="btn btn-primary" onclick="openBird()">＋ เพิ่มนก</button><button class="btn btn-secondary" onclick="openPair()">❤️ เพิ่มคู่</button><button class="btn btn-secondary" onclick="openFinance('expense')">＋ รายจ่าย</button><button class="btn btn-secondary" onclick="openFinance('income')">＋ รายรับ</button></div></div></div>`}
function renderBirds(){const s=state.birds.map(b=>`<tr><td><b>${esc(b.ring||b.code||b.id)}</b><div class="text-xs text-slate-500">${esc(b.name)}</div></td><td>${esc(b.color||b.mutation||"-")}</td><td>${esc(b.gender||b.sex||"-")}</td><td>${toDDMMYYYY(b.dob||b.birthDate||"")||"-"}<div class="text-xs">${age(b.dob||b.birthDate)}</div></td><td><span class="badge">${esc(b.status||"-")}</span></td><td><div class="flex gap-1"><button class="btn btn-secondary text-xs" onclick="showBird('${b.id}')">ดู</button><button class="btn btn-secondary text-xs" onclick="editBird('${b.id}')">แก้</button></div></td></tr>`).join("");document.getElementById("birds").innerHTML=`<div class="card p-4 mb-4"><div class="flex gap-2"><input id="birdSearch" placeholder="ค้นหารหัส / ชื่อ / สี / เพศ" oninput="filterBirds()"><button class="btn btn-primary whitespace-nowrap" onclick="openBird()">＋ เพิ่ม</button></div></div><div class="card overflow-hidden"><div class="overflow-auto"><table><thead><tr><th>รหัส/ชื่อ</th><th>Mutation</th><th>เพศ</th><th>วันเกิด/อายุ</th><th>สถานะ</th><th></th></tr></thead><tbody id="birdRows">${s}</tbody></table></div></div>`}window.filterBirds=()=>{const q=(document.getElementById("birdSearch")?.value||"").toLowerCase();document.querySelectorAll("#birdRows tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
function renderPairs(){
  const filter=document.getElementById("pairStatusFilter")?.value||"active";
  const rows=state.pairs
    .filter(p=>{const st=p.status||"active";return filter==="all"||st===filter})
    .map(p=>`<tr>
      <td><b>${esc(p.name||p.id)}</b><div class="text-xs text-slate-500">${toDDMMYYYY(p.pairDate||p.startDate||"")}</div></td>
      <td>${esc(birdName(p.maleId||p.maleBirdId))}</td>
      <td>${esc(birdName(p.femaleId||p.femaleBirdId))}</td>
      <td><span class="badge ${((p.status||"active")==="active")?"bg-emerald-100 text-emerald-700":"bg-slate-100 text-slate-600"}">${(p.status||"active")==="active"?"ACTIVE":"INACTIVE"}</span></td>
      <td class="text-xs">${esc(p.geneticsNotes||"-")}</td>
      <td><div class="flex gap-1">
        ${(p.status||"active")==="active"?`<button class="btn btn-secondary text-xs" onclick="deactivatePair('${p.id}')">พัก/แยกคู่</button>`:`<button class="btn btn-secondary text-xs" onclick="reactivatePair('${p.id}')">เปิดใช้งาน</button>`}
        <button class="btn btn-secondary text-xs" onclick="showPairLog('${p.id}')">Log</button>
      </div></td>
    </tr>`).join("");
  document.getElementById("pairs").innerHTML=`
    <div class="card p-4 mb-4 flex flex-wrap justify-between items-center gap-3">
      <div><h3 class="font-extrabold">คู่พ่อแม่พันธุ์</h3><p class="text-xs text-slate-500">ไม่ลบประวัติเดิม — เปลี่ยนสถานะเป็น ACTIVE / INACTIVE เพื่อเก็บ Log</p></div>
      <div class="flex gap-2 items-center">
        <select id="pairStatusFilter" onchange="window.renderPairs()">
          <option value="active" ${filter==="active"?"selected":""}>แสดงเฉพาะ ACTIVE</option>
          <option value="all" ${filter==="all"?"selected":""}>แสดงทั้งหมด</option>
          <option value="inactive" ${filter==="inactive"?"selected":""}>แสดงเฉพาะ INACTIVE</option>
        </select>
        <button class="btn btn-primary" onclick="openPair()">＋ เพิ่มคู่</button>
      </div>
    </div>
    <div class="card overflow-auto"><table><thead><tr><th>ชื่อคู่</th><th>ตัวผู้</th><th>ตัวเมีย</th><th>สถานะ</th><th>พันธุกรรม</th><th>จัดการ</th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="text-slate-400">ไม่พบข้อมูลตามตัวกรอง</td></tr>`}</tbody></table></div>`;
}
  window.renderPairs = renderPairs;
function renderCycles(){
  const activePairs=state.pairs.filter(p=>(p.status||"active")==="active");
  document.getElementById("cycles").innerHTML=`<div class="card p-5">
    <div class="flex justify-between"><div><h3 class="font-extrabold">🔄 รอบเพาะพันธุ์</h3><p class="text-sm text-slate-500">รอบเพาะต้องผูกกับคู่ที่ ACTIVE</p></div><button class="btn btn-primary" onclick="openCycle()">＋ เพิ่มรอบ</button></div>
    <div class="mt-4 space-y-2">${state.cycles.map(x=>`<div class="p-3 rounded-xl bg-slate-50 border"><b>${esc(x.name||x.id)}</b> · ${toDDMMYYYY(x.firstEggDate||"")} · ${esc(x.pairId?birdName((state.pairs.find(p=>p.id===x.pairId)||{}).maleId):"")} · ไข่ ${x.eggCount||0} · ฟัก ${x.hatchedCount||0}</div>`).join("")||"<p class='text-slate-400'>ยังไม่มีรอบเพาะ</p>"}</div>
  </div>`;
}
function renderEggs(){
    document.getElementById("eggs").innerHTML = `
        <div class="card p-5">

            <div class="flex justify-between">
                <div>
                    <h3 class="font-extrabold">🥚 ไข่</h3>
                    <p class="text-sm text-slate-500">
                        บันทึกไข่ ตรวจเชื้อ และวันคาดฟัก
                    </p>
                </div>

                <button class="btn btn-primary" onclick="openEgg()">
                    ＋ เพิ่มไข่
                </button>
            </div>

            <div class="mt-4 grid gap-2">

                ${
                    state.eggs.length
                    ? state.eggs.map(x => {

                        const cycle = state.cycles.find(
                            c => String(c.id) === String(x.cycleId)
                        );

                        const pair = cycle
                            ? state.pairs.find(
                                p => String(p.id) === String(cycle.pairId)
                            )
                            : null;

                        const pairText = pair
                            ? `${birdName(pair.maleId)} × ${birdName(pair.femaleId)}`
                            : "ไม่พบข้อมูลคู่พ่อแม่";

                        const cycleText = cycle
                            ? `${cycle.name || ("รอบ " + cycle.id)}`
                            : "ไม่พบรอบเพาะพันธุ์";

                        return `
                            <div class="p-3 border rounded-xl">

                                <div class="flex justify-between items-start gap-3">

                                    <div class="min-w-0">

                                        <div class="font-bold">
                                            🥚 ไข่ #${esc(x.eggNo || x.id)}
                                            · ${toDDMMYYYY(x.laidDate || "")}
                                        </div>

                                        <div class="text-sm text-slate-600 mt-1">
                                            รอบ: ${esc(cycleText)}
                                        </div>

                                        <div class="text-sm text-slate-600">
                                            คู่: ${esc(pairText)}
                                        </div>

                                    </div>

                                    <div class="flex items-center gap-2 shrink-0">

                                        <span class="badge">
                                            ${esc(x.fertility || "รอตรวจ")}
                                        </span>

                                            ✏️ แก้ไข
                                        </button>

                                    </div>

                                </div>

                            </div>
                        `;

                    }).join("")
                    : `
                        <p class="text-slate-400">
                            ยังไม่มีข้อมูลไข่
                        </p>
                    `
                }

            </div>
        </div>
    `;
}
window.editEgg = id => {
    const egg = state.eggs.find(
        x => String(x.id) === String(id)
    );

    if (!egg) {
        alert("ไม่พบข้อมูลไข่");
        return;
    }

    const cycle = state.cycles.find(
        x => String(x.id) === String(egg.cycleId)
    );

    const pair = cycle
        ? state.pairs.find(
            x => String(x.id) === String(cycle.pairId)
        )
        : null;

    const pairText = pair
        ? `${birdName(pair.maleId)} × ${birdName(pair.femaleId)}`
        : "ไม่พบข้อมูลคู่พ่อแม่";

    const cycleText = cycle
        ? `${cycle.name || ("รอบ " + cycle.id)} · ${toDDMMYYYY(cycle.firstEggDate || "")}`
        : "ไม่พบรอบเพาะพันธุ์";

    modal(
        "แก้ไขข้อมูลไข่",
        `
        <div class="grid gap-3">

            <div>
                <label>รอบเพาะพันธุ์</label>
                <input
                    type="text"
                    value="${esc(cycleText)}"
                    readonly
                >
                <p class="text-xs text-slate-400 mt-1">
                    คู่: ${esc(pairText)}
                </p>
            </div>

            <div>
                <label>ลำดับไข่</label>
                <input
                    type="number"
                    value="${esc(egg.eggNo || "")}"
                    readonly

                </p>
            </div>

            <div>

                    type="text"
                    value="${esc(toDDMMYYYY(egg.laidDate || ""))}"
                    readonly
                >
                <p class="text-xs text-slate-400 mt-1">
                    วันที่ไข่เดิม ไม่สามารถเปลี่ยนได้
                </p>
            </div>

            ${dateField(
                "editEggCheck",
                "วันที่ตรวจเชื้อ",
                toDDMMYYYY(egg.checkDate || "")
            )}

            <div>
                <label>วันคาดฟัก</label>
                <input
                    id="editEggHatch"
                    type="text"
                    value="${esc(toDDMMYYYY(egg.expectedHatchDate || ""))}"
                    readonly
                >
                <p class="text-xs text-slate-400 mt-1">
                    ระบบจะคำนวณอัตโนมัติจากวันที่ไข่ + 23 วัน เมื่อผลตรวจเป็น "มีเชื้อ"
                </p>
            </div>

            <div>
                <label>ผลตรวจเชื้อ</label>
                <select id="editEggF">
                    <option
                        value="รอตรวจ"
                        ${egg.fertility === "รอตรวจ" ? "selected" : ""}
                    >
                        รอตรวจ
                    </option>

                    <option
                        value="มีเชื้อ"
                        ${egg.fertility === "มีเชื้อ" ? "selected" : ""}
                    >
                        มีเชื้อ
                    </option>

                    <option
                        value="ไม่มีเชื้อ"
                        ${egg.fertility === "ไม่มีเชื้อ" ? "selected" : ""}
                    >
                        ไม่มีเชื้อ
                    </option>
                </select>
            </div>

        </div>

        <button
            class="btn btn-primary w-full mt-4"
            onclick="saveEditedEgg('${id}')"
        >
            บันทึกการแก้ไข
        </button>
        `
    );
};
window.saveEditedEgg = async id => {
    const egg = state.eggs.find(
        x => String(x.id) === String(id)
    );

    if (!egg) {
        alert("ไม่พบข้อมูลไข่");
        return;
    }

    const fertility =
        document.getElementById("editEggF").value;

    const checkDate =
        toISODate(
            document.getElementById("editEggCheck").value
        );

    const laidDate = egg.laidDate || "";

    let expectedHatchDate = "";

    if (fertility === "มีเชื้อ" && laidDate) {
        const hatchDate = new Date(
            laidDate + "T00:00:00Z"
        );

            hatchDate.getUTCDate() + 23
        );
        
        expectedHatchDate =
            hatchDate.toISOString().slice(0, 10);
      }

    await save(
        "eggs",
        {
            cycleId: egg.cycleId,
            eggNo: egg.eggNo,
            laidDate: laidDate,
            checkDate: checkDate,
            expectedHatchDate: expectedHatchDate,
            fertility: fertility
        },
        id
    );

    closeModal();
};

window.saveChickWeight = async id => {

    );

    const date =
        toISODate(
            document.getElementById("chickWeightDate").value
        );

        Number(
            document.getElementById("chickWeightValue").value
        );

        document.getElementById("chickWeightNotes").value.trim();

    if (!date) {
        alert("กรุณากรอกวันที่ชั่งน้ำหนัก");

    }

    if (!Number.isFinite(weight) || weight <= 0) {
        alert("กรุณากรอกน้ำหนักให้ถูกต้อง");

        "weights",
        {
            chickId: chick.id,

            weight: weight,
            notes: notes

        "chicks",

            fatherId: chick.fatherId || "",

            birthDate: chick.birthDate || "",

            mutation: chick.mutation || "",

window.setNextEggNo=()=>{
    const cycleId=document.getElementById("egCycle")?.value;
    const input=document.getElementById("egNo");

    if(!input) return;

    if(!cycleId){
        input.value="";
        return;
    }

    const eggs=Array.isArray(state.eggs)
        ? state.eggs.filter(
            e=>String(e.cycleId)===String(cycleId)
        )
        : [];

    const numbers=eggs
        .map(e=>Number(e.eggNo))
        .filter(Number.isFinite);

    const legacyCount=eggs.filter(
        e=>!Number.isFinite(Number(e.eggNo))
    ).length;

    const highestNo=numbers.length
        ? Math.max(...numbers)
        : 0;

    const nextNo=Math.max(highestNo,legacyCount)+1;

    input.value = nextNo;
    input.setAttribute("value", String(nextNo));
};

  window.getNextChickCode = () => {
    const numbers = Array.isArray(state.chicks)
        ? state.chicks
            .map(x => {
                const m = String(x.code || "").match(/^CH-(\d+)$/i);
                return m ? Number(m[1]) : NaN;
            })
            .filter(Number.isFinite)
        : [];

    const highestNo = numbers.length
        ? Math.max(...numbers)
        : 0;

    return `CH-${String(highestNo + 1).padStart(4, "0")}`;
};

window.updateChickSource = () => {

    const eggId =
        document.getElementById("cEgg")?.value;

    const box =
        document.getElementById("chickSourceInfo");

    if (!box) return;

    if (!eggId) {
        box.innerHTML =
            "กรุณาเลือกไข่ต้นทาง";
        return;
    }

    if (eggId === "external") {
        box.innerHTML = `
            <div class="font-semibold">
                🐣 ลูกนกจากภายนอก / ไม่ทราบไข่ต้นทาง
            </div>
            <div class="text-xs text-slate-500 mt-1">
                สามารถกรอกข้อมูลพ่อและแม่ภายหลังได้
            </div>
        `;
        return;
    }

    const egg = state.eggs.find(
        x => String(x.id) === String(eggId)
    );

    if (!egg) {
        box.innerHTML =
            "ไม่พบข้อมูลไข่";
        return;
    }

    const cycle = state.cycles.find(
        x => String(x.id) === String(egg.cycleId)
    );

    const pair = cycle
        ? state.pairs.find(
            x => String(x.id) === String(cycle.pairId)
        )
        : null;

    const father = pair
        ? birdName(pair.maleId)
        : "-";

    const mother = pair
        ? birdName(pair.femaleId)
        : "-";

    const cycleText = cycle
        ? (cycle.name || ("รอบ " + cycle.id))
        : "-";

    box.innerHTML = `
        <div class="font-semibold">
            🥚 ไข่ #${esc(egg.eggNo || egg.id)}
        </div>

        <div class="mt-1">
            รอบเพาะพันธุ์:
            ${esc(cycleText)}
        </div>

        <div>
            วันที่ไข่:
            ${esc(toDDMMYYYY(egg.laidDate || "-"))}
        </div>

        <div>
            วันคาดฟัก:
            ${esc(toDDMMYYYY(egg.expectedHatchDate || "-"))}
        </div>

        <div>
            👨 พ่อ:
            ${esc(father)}
        </div>

        <div>
            👩 แม่:
            ${esc(mother)}
        </div>
    `;
};
window.saveNewChick = async () => {

    const eggId =
        document.getElementById("cEgg").value;

    if (!eggId) {
        alert("กรุณาเลือกไข่ต้นทาง");
        return;
    }

    const code =
        document.getElementById("cCode").value;

    const ring =
        document.getElementById("cRing").value;

    const name =
        document.getElementById("cName").value;

    const birthDate =
        toISODate(
            document.getElementById("cDate").value
        );

    const mutation =
        document.getElementById("cMutation").value;

    const latestWeight =
        Number(
            document.getElementById("cWeight").value || 0
        );

    const notes =
        document.getElementById("cNotes").value;

    let egg = null;
    let cycle = null;
    let pair = null;

    if (eggId !== "external") {

        egg = state.eggs.find(
            x => String(x.id) === String(eggId)
        );

        if (!egg) {
            alert("ไม่พบข้อมูลไข่ต้นทาง");
            return;
        }

        cycle = state.cycles.find(
            x => String(x.id) === String(egg.cycleId)
        );

        pair = cycle
            ? state.pairs.find(
                x => String(x.id) === String(cycle.pairId)
            )
            : null;
    }

    await save(
        "chicks",
        {
            code: code,
            ring: ring,
            name: name,

            eggId:
                eggId === "external"
                    ? ""
                    : eggId,

            cycleId:
                cycle?.id || "",

            fatherId:
                pair?.maleId || "",

            motherId:
                pair?.femaleId || "",

            birthDate: birthDate,

            mutation: mutation,

            latestWeight: latestWeight,

            notes: notes
        }
    );
};
