<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BirdsMyBoss DEV cleanup</title></head>
<body>
<h1>BirdsMyBoss DEV cleanup</h1>
<p><strong>Target:</strong> birdsmyboss-v1-dev</p>
<p>เครื่องมือนี้จะไม่ลบ collection <code>birds</code></p>
<button id="scan">ตรวจข้อมูล DEV</button>
<pre id="log">Ready</pre>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBpmzv3-IaHNlBNSwSDwifz7UROVoThLdI',authDomain:'birdsmyboss-v1-dev.firebaseapp.com',projectId:'birdsmyboss-v1-dev',storageBucket:'birdsmyboss-v1-dev.firebasestorage.app',messagingSenderId:'964932335674',appId:'1:964932335674:web:54bb85d9c8377817895d03'};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const log=document.getElementById('log');
const collections=['assetIntakes','breedingCycles','cageAssignments','cages','customers','deliveries','documents','eggs','giveaways','handovers','pairMembers','pairs','payments','photos','priceHistory','refunds','reservations','saleTimeline','sales','sexHistory','weightHistory'];
document.getElementById('scan').onclick=async()=>{log.textContent='Scanning DEV...\n'; for(const name of collections){try{const s=await getDocs(collection(db,name));log.textContent+=`${name}: ${s.size}\n`;}catch(e){log.textContent+=`${name}: ERROR ${e.code||e.message}\n`;}}log.textContent+='\nbirds: PROTECTED / NOT TOUCHED';};
</script></body></html>
