<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Firebase Read-only Audit Tool — BirdsMyBoss</title>
  <style>
    body{font-family:system-ui,Segoe UI,Helvetica,Arial;max-width:980px;margin:24px auto;color:#0f172a}
    pre{background:#f1f5f9;padding:12px;border-radius:8px;overflow:auto}
    label{display:block;margin-top:12px;font-weight:600}
    input,textarea,button{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px}
    .row{display:flex;gap:8px;align-items:center;margin-top:8px}
    button{background:#0ea5a4;color:white;border:none}
    .danger{background:#ef4444}
    .result{margin-top:12px}
  </style>
</head>
<body>
  <h1>Firebase Read-only Audit Tool — BirdsMyBoss</h1>
  <p>This standalone audit tool only reads data (no writes). Do not upload service account keys here. If you need Admin access, run a separate Admin script locally.</p>

  <label>Firebase Config (optional) — leave blank to use default config embedded in the tool</label>
  <textarea id="firebaseConfig" rows="6" style="width:100%">{
  "apiKey": "AIzaSyBohCYrkHMOpF3YuOk3TAt8IeMYVL-ahzw",
  "authDomain": "birdsmyboss.firebaseapp.com",
  "databaseURL": "https://birdsmyboss-default-rtdb.asia-southeast1.firebasedatabase.app",
  "projectId": "birdsmyboss",
  "storageBucket": "birdsmyboss.firebasestorage.app",
  "messagingSenderId": "626059198758",
  "appId": "1:626059198758:web:81dc5eb114cf964ec501e7",
  "measurementId": "G-CZ3C54MSL8"
}</textarea>

  <label>appId (artifacts/{appId}/public/data/...)</label>
  <input id="appId" value="birdsmyboss-app" style="width:100%" />

  <div class="row">
    <button id="btn-audit-firestore">Run Firestore Audit (read-only)</button>
    <button id="btn-audit-rtdb">Run RTDB Audit (read-only)</button>
    <button id="btn-check-local">Check LocalStorage (gcc_aviary_data_v4)</button>
    <button id="btn-download" style="margin-left:auto">Download JSON Report</button>
  </div>

  <div class="result">
    <h3>Audit Log</h3>
    <pre id="log">Ready</pre>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    const logEl = document.getElementById('log');
    function log(...args){
      console.log(...args);
      const s = args.map(a => (typeof a==='object'?JSON.stringify(a,null,2):String(a))).join(' ');
      logEl.textContent = (logEl.textContent || '') + '\n' + s;
    }

    function clearLog(){ logEl.textContent = '' }

    let auditReport = { firestore: {}, rtdb: {}, local: {}, generatedAt: new Date().toISOString() };

    function parseConfig(text){
      try{ return JSON.parse(text); }catch(e){ return null }
    }

    async function initFirebaseFromInput(){
      const cfgText = document.getElementById('firebaseConfig').value.trim();
      const cfg = parseConfig(cfgText) || {
        apiKey: "AIzaSyBohCYrkHMOpF3YuOk3TAt8IeMYVL-ahzw",
        authDomain: "birdsmyboss.firebaseapp.com",
        databaseURL: "https://birdsmyboss-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "birdsmyboss",
        storageBucket: "birdsmyboss.firebasestorage.app",
        messagingSenderId: "626059198758",
        appId: "1:626059198758:web:81dc5eb114cf964ec501e7",
        measurementId: "G-CZ3C54MSL8"
      };
      const app = initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const rtdb = getDatabase(app);
      return { app, auth, db, rtdb };
    }

    async function tryAnonymousSignIn(auth){
      try{
        await signInAnonymously(auth);
        log('Signed in anonymously (client).');
        return true;
      }catch(err){
        log('Anonymous sign-in failed:', err.code || err.message || err);
        return false;
      }
    }

    function analyzeDocsSnapshot(docs){
      const result = { count: docs.length, ids: [], fields: {}, samples: [] };
      for(let i=0;i<docs.length;i++){
        const doc = docs[i];
        result.ids.push(doc.id || (doc._key && doc._key.path && doc._key.path.segments?doc._key.path.segments.slice(-1)[0]:'<no-id>'));
        const data = doc.data ? doc.data() : (doc.value || {});
        if(result.samples.length < 3) result.samples.push({ id: result.ids[result.ids.length-1], data });
        for(const k of Object.keys(data||{})){
          if(!result.fields[k]) result.fields[k] = { count:0, types: new Set() };
          result.fields[k].count++;
          result.fields[k].types.add(typeof data[k]);
        }
      }
      // convert types sets to arrays
      for(const k of Object.keys(result.fields)){
        result.fields[k].types = Array.from(result.fields[k].types);
      }
      return result;
    }

    async function auditFirestore(){
      clearLog(); log('Starting Firestore audit (read-only)...');
      auditReport.firestore = {};
      const appId = (document.getElementById('appId').value || 'birdsmyboss-app').trim();
      const collNames = ['birds','pairs','clutches','sales'];

      const { app, auth, db } = await initFirebaseFromInput();
      const signed = await tryAnonymousSignIn(auth);

      for(const coll of collNames){
        try{
          log(`Reading collection artifacts/${appId}/public/data/${coll} ...`);
          const colRef = collection(db, 'artifacts', appId, 'public', 'data', coll);
          const snapshot = await getDocs(colRef);
          const docs = [];
          snapshot.forEach(d=>docs.push(d));
          const analyzed = analyzeDocsSnapshot(docs);

          // additional analysis: detect missing important fields and duplicate rings for birds
          const missing = [];
          const duplicates = { ids: [], rings: [] };

          if(coll === 'birds'){
            const ringMap = {};
            for(const d of docs){
              const data = d.data();
              const id = d.id;
              if(!data.ring) missing.push({ id, reason: 'missing ring' });
              if(!data.gender) missing.push({ id, reason: 'missing gender' });
              if(!data.color) missing.push({ id, reason: 'missing color' });
              if(!data.status) missing.push({ id, reason: 'missing status' });
              if(!data.dob) {/* optional */}
              // duplicate rings
              const ring = data.ring;
              if(ring){
                if(!ringMap[ring]) ringMap[ring]=[];
                ringMap[ring].push({ id, name: data.name || null });
              }
            }
            for(const r of Object.keys(ringMap)) if(ringMap[r].length>1) duplicates.rings.push({ ring:r, records: ringMap[r] });

            // duplicate ids (shouldn't happen in Firestore) — detect same id repeated
            const idCounts = {};
            for(const d of docs){ idCounts[d.id] = (idCounts[d.id]||0)+1; }
            for(const id in idCounts) if(idCounts[id]>1) duplicates.ids.push({ id, count: idCounts[id] });

            auditReport.firestore[coll] = { analyzed, missing, duplicates };
          } else if(coll === 'pairs'){
            // detect missing maleId/femaleId
            const missingPairs = [];
            const idCounts = {};
            for(const d of docs){ const data = d.data(); const id=d.id; if(!data.maleId || !data.femaleId) missingPairs.push({id,missing: {maleId:!data.maleId, femaleId:!data.femaleId}}); idCounts[id]=(idCounts[id]||0)+1 }
            const duplicateIds = Object.keys(idCounts).filter(id=>idCounts[id]>1).map(id=>({id,count:idCounts[id]}));
            auditReport.firestore[coll] = { analyzed, missing: missingPairs, duplicates: { ids: duplicateIds } };
          } else if(coll === 'clutches'){
            // clutches schema unknown; list field names and samples
            auditReport.firestore[coll] = { analyzed, note: 'clutches schema may be sparse or absent' };
          } else if(coll === 'sales'){
            // detect missing key fields
            const missingSales = [];
            const idCounts = {};
            const ringMap = {};
            for(const d of docs){ const data = d.data(); const id=d.id; if(!data.date || !data.price || !data.customerName) missingSales.push({id,missing:{date:!data.date,price:!data.price,customerName:!data.customerName}}); idCounts[id]=(idCounts[id]||0)+1; if(data.birdRing){ if(!ringMap[data.birdRing]) ringMap[data.birdRing]=[]; ringMap[data.birdRing].push({id,customerName:data.customerName}) } }
            const duplicateIds = Object.keys(idCounts).filter(id=>idCounts[id]>1).map(id=>({id,count:idCounts[id]}));
            const duplicateRings = Object.keys(ringMap).filter(r=>ringMap[r].length>1).map(r=>({ring:r,records:ringMap[r]}));
            auditReport.firestore[coll] = { analyzed, missing: missingSales, duplicates: { ids: duplicateIds, rings: duplicateRings } };
          }

          log(`Collection ${coll}: ${analyzed.count} documents`);
        }catch(err){
          log(`Failed to read collection ${coll}:`, err && err.code ? (err.code + ' ' + err.message) : err);
          auditReport.firestore[coll] = { error: String(err && (err.code || err.message) || err) };
        }
      }
      auditReport.generatedAt = new Date().toISOString();
      log('Firestore audit completed.');
    }

    function analyzeObjectCollection(obj){
      // obj is keyed by id or array
      const entries = [];
      if(!obj) return { count:0, ids:[], fields:{}, samples:[] };
      if(Array.isArray(obj)){
        for(const item of obj) entries.push(item);
      } else {
        for(const k of Object.keys(obj)){
          const item = obj[k];
          const data = Object.assign({id:k}, item);
          entries.push(data);
        }
      }
      const sampleCount = Math.min(3, entries.length);
      const ids = entries.map(e=>e.id || e.id===0?String(e.id):'<no-id>');
      const fields = {};
      for(const e of entries){
        for(const k of Object.keys(e)){
          if(!fields[k]) fields[k] = { count:0, types: new Set() };
          fields[k].count++;
          fields[k].types.add(typeof e[k]);
        }
      }
      for(const k of Object.keys(fields)) fields[k].types = Array.from(fields[k].types);
      return { count: entries.length, ids, fields, samples: entries.slice(0,sampleCount) };
    }

    async function auditRTDB(){
      clearLog(); log('Starting RTDB audit (read-only)...');
      auditReport.rtdb = {};
      const appId = (document.getElementById('appId').value || 'birdsmyboss-app').trim();
      const { app, auth, rtdb } = await initFirebaseFromInput();
      const signed = await tryAnonymousSignIn(auth);
      const dbRef = ref(rtdb, '/');
      try{
        const snapshot = await get(dbRef);
        if(!snapshot.exists()){
          log('RTDB: no data found at root');
          auditReport.rtdb.dataFound = false;
          return;
        }
        const root = snapshot.val();
        auditReport.rtdb.dataFound = true;
        auditReport.rtdb.topLevelKeys = Object.keys(root || {});
        log('RTDB top-level keys:', auditReport.rtdb.topLevelKeys);
        // check artifacts path
        const artifactsPath = root.artifacts && root.artifacts[appId] && root.artifacts[appId].public && root.artifacts[appId].public.data;
        if(artifactsPath){
          auditReport.rtdb.artifactsPathFound = true;
          auditReport.rtdb.collections = {};
          const collNames = Object.keys(artifactsPath || {});
          for(const coll of collNames){
            const collObj = artifactsPath[coll];
            const analyzed = analyzeObjectCollection(collObj);
            auditReport.rtdb.collections[coll] = analyzed;
            log(`RTDB artifacts/${appId}/public/data/${coll}: ${analyzed.count} records`);
          }
        } else {
          auditReport.rtdb.artifactsPathFound = false;
          log('RTDB: artifacts path for appId not found under /artifacts/{appId}/public/data');
        }
      }catch(err){
        log('Failed to read RTDB root:', err && err.code? (err.code+' '+err.message): err);
        auditReport.rtdb.error = String(err && (err.code || err.message) || err);
      }
      auditReport.generatedAt = new Date().toISOString();
      log('RTDB audit completed.');
    }

    function analyzeLocalStorage(){
      clearLog(); log('Reading localStorage key gcc_aviary_data_v4 (this reads client browser localStorage only)');
      auditReport.local = {};
      try{
        const raw = localStorage.getItem('gcc_aviary_data_v4');
        if(!raw){ log('No localStorage key found'); auditReport.local.present = false; return; }
        const data = JSON.parse(raw);
        auditReport.local.present = true;
        const keys = ['birds','pairs','clutches','sales'];
        for(const k of keys){
          const arr = data[k] || [];
          const analyzed = analyzeObjectCollection(arr);
          // duplicate rings and ids for birds
          if(k==='birds'){
            const ringMap = {};
            const idCounts = {};
            const missing = [];
            const entries = Array.isArray(arr)?arr: (arr?Object.values(arr):[]);
            for(const item of entries){
              const id = item.id || '<no-id>';
              idCounts[id] = (idCounts[id]||0)+1;
              if(item.ring){ if(!ringMap[item.ring]) ringMap[item.ring]=[]; ringMap[item.ring].push({ id, name: item.name || null }); } else missing.push({id,reason:'missing ring'});
              if(!item.gender) missing.push({id,reason:'missing gender'});
              if(!item.color) missing.push({id,reason:'missing color'});
              if(!item.status) missing.push({id,reason:'missing status'});
            }
            const dupRings = Object.keys(ringMap).filter(r=>ringMap[r].length>1).map(r=>({ring:r,records:ringMap[r]}));
            const dupIds = Object.keys(idCounts).filter(id=>idCounts[id]>1).map(id=>({id,count:idCounts[id]}));
            auditReport.local[k] = { analyzed, duplicates: { rings: dupRings, ids: dupIds }, missing };
          } else {
            auditReport.local[k] = { analyzed };
          }
        }
      }catch(err){ log('Error reading localStorage:', err); auditReport.local.error = String(err); }
      auditReport.generatedAt = new Date().toISOString();
      log('LocalStorage audit completed.');
    }

    document.getElementById('btn-audit-firestore').addEventListener('click', async ()=>{ try{ await auditFirestore(); alert('Firestore audit finished. See log and download report.'); }catch(e){ log('Firestore audit error', e); alert('Error - see log'); }});
    document.getElementById('btn-audit-rtdb').addEventListener('click', async ()=>{ try{ await auditRTDB(); alert('RTDB audit finished. See log and download report.'); }catch(e){ log('RTDB audit error', e); alert('Error - see log'); }});
    document.getElementById('btn-check-local').addEventListener('click', async ()=>{ try{ analyzeLocalStorage(); alert('LocalStorage check finished. See log and download report.'); }catch(e){ log('LocalStorage error', e); alert('Error - see log'); }});

    document.getElementById('btn-download').addEventListener('click', ()=>{
      const data = Object.assign({}, auditReport, { generatedAt: new Date().toISOString() });
      const blob = new Blob([JSON.stringify(data,null,2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `birdsmyboss_firebase_audit_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
    });

  </script>
</body>
</html>
